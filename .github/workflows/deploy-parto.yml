name: CI/CD PARTO Auto-Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'k8s/**'
      - '.github/workflows/deploy-parto.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push backend image
        run: |
          docker build -f backend/Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-backend:latest ./backend
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-backend:latest

      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-frontend:latest ./frontend
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-frontend:latest


      - name: Install Cloudflare Tunnel Client (cloudflared)
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Set up SSH configuration for Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_rsa
          ${{ secrets.SSH_PRIVATE_KEY_HOST_C }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          
          # Base SSH configuration
          cat <<EOF > ~/.ssh/config
          Host ssh-cloud.26i.uk
              HostName ssh-cloud.26i.uk
              User cloud
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
          EOF
          
          # Inject Cloudflare Access Service Token headers
          echo "    ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${{ secrets.CF_CLIENT_ID_HOST_C }} --service-token-secret ${{ secrets.CF_CLIENT_SECRET_HOST_C }}" >> ~/.ssh/config

      - name: Transfer Kubernetes Manifests to Host C
        run: |
          ssh -v cloud@ssh-cloud.26i.uk "rm -rf ~/parto/k8s && mkdir -p ~/parto/k8s"
          scp -v -r k8s/* ssh-cloud.26i.uk:~/parto/k8s/

      - name: Deploy via Host C k8s Cluster
        run: |
          ssh -v cloud@ssh-cloud.26i.uk 'echo "${{ secrets.HOST_C_SUDO_PASS }}" | sudo -S sh -c "
            if [ -f /etc/kubernetes/admin.conf ]; then
              export KUBECONFIG=/etc/kubernetes/admin.conf
            elif [ -f /etc/rancher/k3s/k3s.yaml ]; then
              export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            elif [ -f /root/.kube/config ]; then
              export KUBECONFIG=/root/.kube/config
            fi
            
            kubectl apply -f /home/cloud/parto/k8s/namespace.yaml
            kubectl apply -f /home/cloud/parto/k8s/postgres.yaml
            kubectl apply -f /home/cloud/parto/k8s/mongodb.yaml
            
            kubectl apply -f /home/cloud/parto/k8s/backend-deployment.yaml
            kubectl apply -f /home/cloud/parto/k8s/frontend-deployment.yaml
            kubectl apply -f /home/cloud/parto/k8s/ingress.yaml
            
            kubectl rollout restart deployment parto-backend -n parto
            kubectl rollout restart deployment parto-frontend -n parto
          "'
