name: CI/CD PARTO Auto-Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'k8s/**'
      - '.github/workflows/deploy-parto.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push backend image
        run: |
          docker build -f backend/Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-backend:latest ./backend
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-backend:latest

      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-frontend:latest ./frontend
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-frontend:latest


      - name: Setup Kubeconfig and Deploy
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          
          cat << 'EOF' > parse_kubeconfig.py
          import os
          import base64
          import re

          secret = os.environ.get("KUBE_CONFIG", "").strip()
          
          # Remove surrounding quotes if the user accidentally included them
          if (secret.startswith("\"") and secret.endswith("\"")) or (secret.startswith("'") and secret.endswith("'")):
              secret = secret[1:-1].strip()
              
          content = secret
          
          # Check if it looks like base64 (no spaces, standard chars)
          if not "apiVersion" in secret and re.match(r"^[A-Za-z0-9+/=\s]+$", secret):
              try:
                  content = base64.b64decode(secret).decode("utf-8")
              except Exception:
                  pass
                  
          # Unescape literal \n if they exist
          content = content.replace("\\n", "\n")
          
          # Replace local IP with public domain
          content = content.replace("192.168.8.106", "ssh-cloud.26i.uk")
          
          with open(os.path.expanduser("~/.kube/config"), "w") as f:
              f.write(content)
          EOF
          
          python3 parse_kubeconfig.py
          chmod 600 ~/.kube/config
          
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/mongodb.yaml
          
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/ingress.yaml
          
          kubectl rollout restart deployment parto-backend -n parto
          kubectl rollout restart deployment parto-frontend -n parto
