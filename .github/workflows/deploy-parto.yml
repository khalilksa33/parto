name: CI/CD PARTO Auto-Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'k8s/**'
      - '.github/workflows/deploy-parto.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push backend image
        run: |
          docker build -f backend/Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-backend:latest ./backend
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-backend:latest

      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-frontend:latest ./frontend
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-frontend:latest


      - name: Setup Kubeconfig and Deploy
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          
          cat << 'EOF' > parse_kubeconfig.py
          import os
          import base64
          import json
          import re

          content = os.environ.get("KUBE_CONFIG", "").strip()
          
          # Strip UTF-8 Byte Order Mark (BOM) if present
          content = content.replace("\ufeff", "")
          
          def unwrap(s):
              if (s.startswith("\"") and s.endswith("\"")) or (s.startswith("'") and s.endswith("'")):
                  return s[1:-1].strip()
              return s

          content = unwrap(content)
              
          # Check if it looks like base64
          if "apiVersion" not in content and re.match(r"^[A-Za-z0-9+/=\s]+$", content):
              try:
                  content = base64.b64decode(content).decode("utf-8").strip()
              except Exception:
                  pass
                  
          # If the content (after possible decoding) is a JSON string representation, unescape it
          if content.startswith("\"") and content.endswith("\""):
              try:
                  content = json.loads(content)
              except Exception:
                  content = unwrap(content)
                  
          # Unescape literal \n if they still exist
          content = content.replace("\\n", "\n")
          content = content.replace("\\r", "")
          
          # Replace local IP with public domain
          content = content.replace("192.168.8.106", "ssh-cloud.26i.uk")
          
          # Safely print first 30 chars of repr to debug the Kubeconfig format without leaking the whole secret
          print("DEBUG KUBECONFIG FORMAT:", repr(content)[:30])
          
          with open(os.path.expanduser("~/.kube/config"), "w") as f:
              f.write(content)
          EOF
          
          python3 parse_kubeconfig.py
          chmod 600 ~/.kube/config
          
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/mongodb.yaml
          
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/ingress.yaml
          
          kubectl rollout restart deployment parto-backend -n parto
          kubectl rollout restart deployment parto-frontend -n parto
