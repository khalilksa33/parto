name: CI/CD PARTO Auto-Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'k8s/**'
      - '.github/workflows/deploy-parto.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push backend image
        run: |
          docker build -f backend/Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-backend:latest ./backend
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-backend:latest

      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-frontend:latest ./frontend
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/parto-frontend:latest

      - name: Setup Kubeconfig with public IP
        id: kubeconfig
        run: |
          cat << 'EOF' > kubeconfig_raw.txt
          ${{ secrets.KUBE_CONFIG }}
          EOF
          # Try decoding. If it's raw YAML, base64 -d will fail or produce garbage.
          if ! cat kubeconfig_raw.txt | base64 -d > kubeconfig.yaml 2>/dev/null || ! grep -q "apiVersion" kubeconfig.yaml; then
            cp kubeconfig_raw.txt kubeconfig.yaml
          fi
          sed -i 's/192.168.8.106/ssh-cloud.26i.uk/g' kubeconfig.yaml
          MODIFIED_CONFIG=$(cat kubeconfig.yaml | base64 -w 0)
          echo "modified_config=$MODIFIED_CONFIG" >> $GITHUB_OUTPUT

      - name: Deploy to k3s cluster
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ steps.kubeconfig.outputs.modified_config }}
          kubectl-version: v1.28.0

      - name: Apply namespace and deploy databases
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/mongodb.yaml

      - name: Apply manifests and rollout
        run: |
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/ingress.yaml
          
          kubectl rollout restart deployment parto-backend -n parto
          kubectl rollout restart deployment parto-frontend -n parto
