name: CI/CD PARTO Auto-Deployment to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Validate & Deploy to parto.dynapulsar.com
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, curl, json, mbstring

      - name: 🔍 Lint PHP Syntax & Code Quality
        run: |
          echo "Checking PHP syntax for all project files..."
          find . -maxdepth 3 -name "*.php" -not -path "*/node_modules/*" -not -path "*/vendor/*" -exec php -l {} \;

      - name: 🚀 Deploy to Hostinger via FTPS / FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.HOSTINGER_REMOTE_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            node_modules/**
            backend/**
            frontend/**
            infrastructure/**
            k8s/**
            *.log
            *.ps1
            *.sh
            .env.example
            rename.py
            generate_docs.py

      - name: 🌐 Verify Deployment Live Ping
        continue-on-error: true
        run: |
          echo "Pinging production domain: https://parto.dynapulsar.com"
          curl -I -s --max-time 10 https://parto.dynapulsar.com || echo "Site will be live once DNS resolves."
