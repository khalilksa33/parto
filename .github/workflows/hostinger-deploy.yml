name: CI/CD PARTO Auto-Deployment to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Validate & Deploy to parto.dynapulsar.com
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, curl, json, mbstring

      - name: 🔍 Lint PHP Syntax & Code Quality
        run: |
          echo "Checking PHP syntax for all project files..."
          find . -maxdepth 3 -name "*.php" -not -path "*/node_modules/*" -not -path "*/vendor/*" -not -path "*/frontend/*" -not -path "*/backend/*" -exec php -l {} \;

      - name: ⚙️ Prepare Hostinger Deployment Configuration
        run: |
          SRV="${{ secrets.HOSTINGER_FTP_SERVER }}"
          [ -z "$SRV" ] && SRV="${{ secrets.FTP_SERVER }}"
          echo "FTP_HOST=$SRV" >> $GITHUB_ENV

          USR="${{ secrets.HOSTINGER_FTP_USERNAME }}"
          [ -z "$USR" ] && USR="${{ secrets.FTP_USERNAME }}"
          echo "FTP_USER=$USR" >> $GITHUB_ENV

          PWD="${{ secrets.HOSTINGER_FTP_PASSWORD }}"
          [ -z "$PWD" ] && PWD="${{ secrets.FTP_PASSWORD }}"
          echo "FTP_PASS=$PWD" >> $GITHUB_ENV

          DIR="${{ secrets.HOSTINGER_REMOTE_DIR }}"
          [ -z "$DIR" ] && DIR="${{ secrets.FTP_DIR }}"
          [ -z "$DIR" ] && DIR="${{ secrets.REMOTE_DIR }}"
          [ -z "$DIR" ] && DIR="public_html/"
          [[ "$DIR" != */ ]] && DIR="${DIR}/"
          echo "FTP_PATH=$DIR" >> $GITHUB_ENV

          echo "Deployment target directory configured as: $DIR"

      - name: 🚀 Deploy to Hostinger via FTPS (Secure Port 21)
        id: deploy_ftps
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ env.FTP_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            node_modules/**
            backend/**
            frontend/**
            infrastructure/**
            k8s/**
            *.log
            *.ps1
            *.sh
            .env.example
            rename.py
            generate_docs.py

      - name: 🚀 Fallback Deploy via Standard FTP (if FTPS certificate warning)
        if: steps.deploy_ftps.outcome == 'failure'
        id: deploy_ftp
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ env.FTP_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            node_modules/**
            backend/**
            frontend/**
            infrastructure/**
            k8s/**
            *.log
            *.ps1
            *.sh
            .env.example
            rename.py
            generate_docs.py

      - name: 🌐 Verify Production Ping
        continue-on-error: true
        run: |
          echo "Pinging production domain: https://parto.dynapulsar.com"
          curl -I -s --max-time 15 https://parto.dynapulsar.com || echo "Site ping completed (check DNS propagation if unreachable)."
