name: CI/CD PARTO Auto-Deployment to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Validate & Deploy to parto.dynapulsar.com
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, curl, json, mbstring

      - name: 🔍 Lint PHP Syntax & Code Quality
        run: |
          echo "Checking PHP syntax for all project files..."
          find . -maxdepth 3 -name "*.php" -not -path "*/node_modules/*" -not -path "*/vendor/*" -not -path "*/frontend/*" -not -path "*/backend/*" -exec php -l {} \;

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 Deploy PARTO Marketplace to Hostinger
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          HOSTINGER_REMOTE_DIR: ${{ secrets.HOSTINGER_REMOTE_DIR }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          python deploy_to_hostinger.py

      - name: 🌐 Production Verification Ping
        if: always()
        run: |
          echo "Pinging production domain: https://parto.dynapulsar.com"
          curl -I -s --max-time 15 https://parto.dynapulsar.com || echo "Site ping completed."
