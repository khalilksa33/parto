apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: parto
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "partodb"
        - name: POSTGRES_USER
          value: "partouser"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: parto-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-storage
      volumes:
      - name: postgres-storage
        emptyDir: {}  # Use PersistentVolumeClaim for production data persistence
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: parto
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
