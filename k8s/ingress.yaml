apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parto-ingress
  namespace: parto
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - parto.26i.uk
    secretName: parto-tls
  rules:
  - host: parto.26i.uk
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: parto-backend
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: parto-frontend
            port:
              number: 80
